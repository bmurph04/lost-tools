# Directory args
input: data/sample_inputs/streamed_frames/left
input_right: data/sample_inputs/streamed_frames/right
input_metadata: data/sample_inputs/streamed_frames/metadata
input_geometry:   # path to yaml
input_camera_coords: unity
output_prefix: outputs/output_streamed_04

# Live stream args
stream_port: 8099
stream_connect: # tcp//host:port to dial out instead of binding

# Boolean/enum args
input_source: streamed # directory | streamed
depth_source: stereo # mono | stereo
geometry_source: metadata # metadata | input | estimation 
pose_source: metadata # metadata | estimation
visualize: true
pred_names: ['near', 'on'] # NOTE: predicate names are static for current implementation, should change if preds are generated
target_image_size: [640, 480]

# Intervals
warmup_frames: 8
detector_interval: 2 # NOTE: in 3D steps, NOT every frame that comes in
global_merge_interval: 2 # NOTE: in 3D steps, NOT every frame that comes in
# Frames between runs of the 3D stack (depth/pose/lift/sgg/merge). The tracker
# runs on every frame regardless, so raising this buys frame rate without ever
# letting object identity break. 1 reproduces the offline behaviour exactly.
sg_interval: 5

# Tracker point decay. Bounds the tracker's working set so frame latency stops
# growing with session length. Points are dropped from within objects, never
# whole objects, so object_id and the scene graph's identity association survive.
point_decay:
  decay_after: 30       # tracker frames an object must survive before it is trimmed (0 disables)
  decay_points: 12      # points a settled object keeps
  min_points: 6         # hard floor; below this the lifter's 2D covariance degenerates
  max_total_points: 512 # global budget across all objects (0 disables)

# Detection-time re-association. Before minting a new object_id, check whether a
# detection is an object the scene graph already holds; reusing that id repairs
# the track rather than creating a duplicate node.
reassociation:
  enabled: true
  max_depth_diff: 0.30   # must stay below broken_track_dist in gaussian_merging.yaml
  bbox_margin: 8.0
  max_visible_frac: 0.5

# 2D scene graph generator [deprecated]
ssg2d:
  model_name:
  config:
  ckpt:
  output_suffix: output_sgg3d

# Depth provider
depth_provider:
  model_name: ffstereo # ffstereo | unidepth | depth_pro
  config: configs/ffstereo.yaml
  ckpt: checkpoints/ffstereo_fastest.pth
  output_suffix: output_depth_provider

# Pose provider
pose_provider:
  model_name: metadata # metadata | dpvo
  config: configs/dpvo.yaml
  ckpt: checkpoints/dpvo.pth
  output_suffix: output_pose_provider

# Tracker
tracker:
  model_name: trackon2 # trackon2
  config: configs/trackon2.yaml
  ckpt: checkpoints/trackon2_dinov3_checkpoint.pt
  output_suffix: output_tracker
  max_grid_size: 6

# Detector
detector:
  model_name: rfdetr # rfdetr
  config:
  ckpt:
  output_suffix: output_detector

# Point lifter
point_lifter:
  model_name: gaussian_3d_lift # gaussian_3d_lift
  config:
  output_suffix: output_point_lifter

# 3D scene graph generator
3dsgg:
  model_name: geometric_3dsg_builder # geometric_3dsg_builder
  config:
  output_suffix: output_sgg3d

# 3D scene graph merger
3dsg_merging:
  model_name: 3d_gaussian_merging # 3d_gaussian_merging
  config: configs/gaussian_merging.yaml
  output_suffix: output_dynamic_sg